<body>
	<div class="game">
		<iframe id="iframe" src="game.html" frameborder="0" oncontextmenu="event.preventDefault()"></iframe>
	</div>
	<div class="foot">
		<ins class="adsbygoogle"
			style="display:inline-block;width:100%;height:50px;"
			data-ad-client="ca-pub-3214612466403714"

	<script src="https://www.hippoobox.com/static/sdk/adsdk_1.8.0.0.js"></script>
	<script>
		// window.onload = function () {
		// 	console.log('onload 上报')
		// 	window.h5sdk.gameLoadingCompleted();
		// };
  	</script>
	<script>
		console.log("add listerner")
		window.ysdk = function() {};
		// 第一个是appkey
		window.h5sdk.init(4917822,"","","","",{
			ga: {
				id: "G-L2NLPJNTLS", // GA跟踪代码 gtag('config', '****');
			},
			adsence: {
				client: "ca-pub-3214612466403714",
				"data-ad-frequency-hint": "45s",
				// "data-adbreak-test": "on",
				"data-ad-channel": "8536733430", // 渠道ID
				callback: () => {
					window.h5sdk.athenaSend("game_start");
					window.h5sdk.adConfig({
						preloadAdBreaks: "on",
						onReady: () => {
							console.log("😋 ", "adconfig success");
							window.h5sdk.adBreak({
								type: "preroll",
								name: "mypreroll",
								adBreakDone: () => {
									console.log("😋 adBreakDone outside");
								},
							});
						},
					});
				},
			},
		});
		let storeCount = 0;
		window.addEventListener('message',(evt)=>{
			console.log(evt);
			if (evt && evt.data==='next'){
				window.h5sdk.adBreak({
					type: "next",
					name: "mynext",
				});
			}else if (evt && evt.data === "gameLoadingCompleted") {
				window.h5sdk.gameLoadingCompleted();
				console.log("接收到完成节点")
			} else if (evt && evt.data==='reward'){
				window.h5sdk.adBreak({
					type: "reward",
					name: "myreward",
					adDismissed: () => {
						console.log("adDismissed");
					},
					adViewed: () => {
						console.log("adViewed");
					},
					beforeReward: (showAdFn) => {
						showAdFn();
					},
					adBreakDone:(info)=>{
						const iframe = document.getElementById('iframe').contentWindow;
						if (info.breakStatus === 'viewed'){
							iframe.postMessage('rewardSuccess');
						} else if (info.breakStatus === 'dismissed'){
							iframe.postMessage('rewardDismissed');
						} else {
							iframe.postMessage('rewardFailed');
						}
					}
				});
			}
		});
	</script>
</body>
  <script>
	function getQueryParams(url = window.location.href) {
		// 创建一个URL对象
		const urlObj = new URL(url);

		// 获取查询参数字符串
		const searchParams = urlObj.searchParams;
		const params = {};

		// 遍历所有参数并添加到对象中
		searchParams.forEach((value, key) => {
			// 如果参数名已存在，将其转换为数组
			if (params[key]) {
				if (Array.isArray(params[key])) {
					params[key].push(value);
				} else {
					params[key] = [params[key], value];
				}
			} else {
				params[key] = value;
			}
		});
		return params;
	}
	const pm = getQueryParams();
	if (pm && pm.bannerTest === 'yes') {
		document.querySelector('body > div.foot')?.remove();
		// 修改class为"game"的div元素的height样式为100%
		const gameDiv = document.querySelector('body > div.game');
		if (gameDiv) {
			gameDiv.style.height = '100%';
		}
	}
</script>
