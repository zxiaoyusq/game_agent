<!DOCTYPE html>
<html style="height: 100%">
  <head>
    <meta charset="UTF-8" />
    <title>Crazy Knifes</title>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no" />
    <meta name="keywords" content="Crazy Knifes" />
    <meta name="description" content="Crazy Knifes" />
    <style>
      * { padding: 0; margin: 0; }
      html, body { width: 100%; height: 100%; background-color: white; overflow: hidden; }
      .game { width: 100vw; height: calc(100% - 50px); }
      .game iframe { width: 100%; height: 100%; border: 0; pointer-events: all; display: block; }
      .foot { position: absolute; bottom: 0; left: 0; width: 100%; height: 50px; text-align: center; }
      .foot ins { width: 320px; height: 50px; display: inline-block; }
    </style>
  </head>
  <body>
    <div class="game">
      <!-- aha-host.js installs the message listener before assigning ./game/index.html. -->
      <iframe id="iframe" allow="autoplay; fullscreen" allowfullscreen title="Crazy Knifes" frameborder="0" oncontextmenu="event.preventDefault()"></iframe>
    </div>
    <div class="foot">
      <ins class="adsbygoogle"
        style="display: inline-block; width: 100%; height: 50px"
        data-ad-client="ca-pub-3214612466403714"
        data-ad-slot="4976762373"></ins>
    </div>
    <!--
      The supplied Crazy Knifes template's app, GA and advertising IDs are preserved.
      Its inline bridge is replaced to correlate callbacks, recover failed requests,
      and report readiness from the actual game instead of the parent page load event.
      The SDK loads asynchronously so a blocked network cannot block the game.
    -->
    <script src="./aha-host.js?v=release-v17-level3"></script>
  </body>
</html>
