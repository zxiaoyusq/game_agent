<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>One Connect 结算界面候选</title><style>body{margin:0;background:#101729;color:#eef4ff;font:16px/1.5 system-ui}main{max-width:720px;margin:40px auto;padding:20px}button{font:inherit;background:#2466aa;color:white;border:1px solid #82d7ff;border-radius:10px;padding:10px 16px;cursor:pointer}p{color:#c1d1e7}</style></head><body><main><h1>结算界面候选预览</h1><p>仅展示布局、文案和按钮状态。星级规则、存档、奖励、广告和关卡推进尚未接入；按钮仅关闭预览。</p><button id="win">预览胜利</button> <button id="fail">预览失败</button><p>界面样式沿用当前蓝色圆润风格；胜利示例不展示未经确认的星数。</p></main><script src="tools/result_panel_candidate.js"></script><script>(function(){let panel=oneConnectResultPanelCandidate.create(document,{home:close,next:close,retry:close});function close(){panel.hide()}document.getElementById('win').onclick=function(){panel.show({kind:'win',level:2,score:88})};document.getElementById('fail').onclick=function(){panel.show({kind:'fail',level:3,score:50})}})();</script></body></html>
