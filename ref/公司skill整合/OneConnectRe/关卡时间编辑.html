<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>One Connect 关卡时间配置</title><style>body{font:16px/1.6 system-ui;margin:0;background:#10172c;color:#edf2ff}main{max-width:900px;margin:auto;padding:28px}section{background:#1d2942;border-radius:12px;padding:20px;margin:18px 0}button,input{font:inherit;padding:8px;border-radius:6px;border:1px solid #6e7b9b}button{cursor:pointer;background:#a8d3ff;color:#10203a}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px;border-bottom:1px solid #4e5974}input[type=number]{width:100px}p{color:#c4d0e8}pre{white-space:pre-wrap;color:#bedfff}</style></head><body><main><h1>关卡时间配置</h1><p>当前只支持调整各关初始时间。棋盘、移动规则与牌面由原版逻辑生成；指定更高关卡编号会覆盖该编号的时间，并不会额外创建固定棋盘。</p><section><label>导入现有 JSON <input type="file" accept=".json,application/json" id="file"></label><table><thead><tr><th>关卡编号</th><th>时间（秒）</th><th></th></tr></thead><tbody id="rows"></tbody></table><p><button id="add">添加关卡</button> <button id="download">下载配置</button></p><p id="message"></p></section><section><h2>应用方法</h2><p>将下载的 JSON 保存为项目目录下 <code>config\levels.json</code>，然后运行项目内的“应用关卡配置.cmd”。重新启动游戏即可使用。未列出的关卡保持原版默认 300 秒。</p><p>修改前请备份旧配置。第一关的时间也可在此调整；目前尚未完成所有后续关卡行为的回归验证。</p></section></main><script>
const body=document.getElementById('rows'), message=document.getElementById('message');function add(level='',seconds=''){let tr=document.createElement('tr');tr.innerHTML='<td><input type="number" min="1" max="100000" step="1" aria-label="关卡编号"></td><td><input type="number" min="1" max="3600" step="1" aria-label="时间秒"></td><td><button>删除</button></td>';tr.querySelectorAll('input')[0].value=level;tr.querySelectorAll('input')[1].value=seconds;tr.querySelector('button').onclick=()=>tr.remove();body.appendChild(tr)}
document.getElementById('add').onclick=()=>add();document.getElementById('file').onchange=async e=>{try{const data=JSON.parse(await e.target.files[0].text());if(!Array.isArray(data.levels))throw Error('缺少 levels 数组');body.replaceChildren();for(const r of data.levels)add(r.level,r.seconds);message.textContent='已导入，请检查并下载。'}catch(err){message.textContent='导入失败：'+err.message}};document.getElementById('download').onclick=()=>{try{const seen=new Set(),levels=[...body.rows].map(tr=>{let inputs=tr.querySelectorAll('input'),level=Number(inputs[0].value),seconds=Number(inputs[1].value);if(!Number.isInteger(level)||level<1||level>100000||!Number.isInteger(seconds)||seconds<1||seconds>3600||seen.has(level))throw Error('关卡编号或时间无效，或编号重复');seen.add(level);return {level,seconds}});let url=URL.createObjectURL(new Blob([JSON.stringify({levels},null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='levels.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);message.textContent='已下载配置文件。'}catch(err){message.textContent='无法下载：'+err.message}};add(1,300);
</script></body></html>
