<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>One Connect 开发预览</title><style>body{margin:0;background:#10172c;color:#edf2ff;font:15px system-ui}header{padding:12px 20px;display:flex;flex-wrap:wrap;gap:16px;align-items:center}main{display:grid;grid-template-columns:minmax(0,3fr) minmax(300px,1fr);gap:12px;padding:0 16px}iframe{display:block;width:100%;max-width:480px;margin:auto;aspect-ratio:9/16;border:0;background:#111}aside{background:#1e2a42;border-radius:8px;padding:12px;max-height:80vh;overflow:auto}button{padding:8px;cursor:pointer}pre{font-size:12px;white-space:pre-wrap;overflow-wrap:anywhere;border-bottom:1px solid #506080;padding:8px 0}p{color:#b9cbe5}@media(max-width:900px){main{display:block}aside{margin-top:12px}}</style></head><body><header><strong>One Connect 开发预览</strong><a href="关卡编辑.html" style="color:#a9d9ff">关卡编辑</a><button id="save">下载本次事件</button><label>画面方向 <select id="orientation"><option value="portrait">竖屏</option><option value="landscape">横屏</option></select></label><label>广告模拟 <select id="admode"><option value="unavailable">不可用</option><option value="returned">接口返回</option><option value="error">接口报错</option><option value="rejected">异步失败</option></select></label></header><main><iframe id="game" src="game/game.html" title="游戏"></iframe><aside><strong>运行诊断</strong><p id="diagnostics">等待游戏启动</p><strong>本地事件</strong><p>仅记录本次页面会话；广告模式仅模拟接口行为，不代表真实展示、关闭回调或奖励发放。</p><div id="events"></div></aside></main><script>
const orientation=document.getElementById('orientation'), previewFrame=document.getElementById('game');orientation.onchange=()=>{const landscape=orientation.value==='landscape';previewFrame.style.aspectRatio=landscape?'16 / 9':'9 / 16';previewFrame.style.maxWidth=landscape?'100%':'480px'};const mode=document.getElementById('admode');function setMock(){if(mode.value==='unavailable'){delete window.h5_sdk;return}window.h5_sdk={showGameLoadingCompleted(){},showAd(kind){if(mode.value==='error')throw Error('模拟广告错误');if(mode.value==='rejected')return Promise.reject(Error('模拟异步失败'));return {simulated:true,kind}}}}mode.onchange=setMock;setMock();let records=[],last=0;const frame=document.getElementById('game'),out=document.getElementById('events');frame.addEventListener('load',()=>{last=0;records=[];out.replaceChildren()});setInterval(()=>{try{const host=frame.contentWindow.oneConnectHost;if(!host)return;let runtime=frame.contentWindow.cr_getC2Runtime&&frame.contentWindow.cr_getC2Runtime();if(runtime)document.getElementById('diagnostics').textContent='布局：'+(runtime.running_layout?runtime.running_layout.name:'加载中')+' · FPS：'+runtime.fps+' · 对象：'+runtime.objectcount+' · 逻辑耗时：'+Math.round(runtime.cpuutilisation)+' 毫秒/秒';let current=host.events();for(const e of current.filter(e=>e.id>last)){records.push(e);let row=document.createElement('pre');row.textContent=JSON.stringify(e,null,2);out.prepend(row)}if(current.length)last=current[current.length-1].id}catch(e){}},300);document.getElementById('save').onclick=()=>{let url=URL.createObjectURL(new Blob([JSON.stringify(records,null,2)],{type:'application/json'}));let a=document.createElement('a');a.href=url;a.download='one-connect-events.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
</script></body></html>
